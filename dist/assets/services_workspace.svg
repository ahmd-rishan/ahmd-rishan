<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C20"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E2D8"/>
      <stop offset="100%" stop-color="#C5C5B9"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Desk Surface -->
  <rect width="600" height="500" fill="#EAEAE2"/>
  <path d="M0 380 L600 380 L600 500 L0 500 Z" fill="url(#deskGrad)"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#B8B8AB" stroke-width="2"/>

  <!-- Monitor Stand Base & Stem -->
  <ellipse cx="380" cy="415" rx="75" ry="18" fill="#17181A" filter="url(#subtleShadow)"/>
  <rect x="368" y="270" width="24" height="135" rx="4" fill="#2D3035"/>
  <rect x="374" y="270" width="12" height="135" fill="#3D4148"/>

  <!-- Main Display Screen Frame -->
  <g filter="url(#subtleShadow)">
    <rect x="130" y="50" width="370" height="280" rx="12" fill="#121315" stroke="#2B2E34" stroke-width="3"/>
    <!-- Screen Inner Bezel -->
    <rect x="140" y="60" width="350" height="260" rx="6" fill="url(#screenGrad)"/>
    
    <!-- Screen Content: "Ideas / Strategy / Execution" -->
    <g transform="translate(180, 135)">
      <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#EAEAE2" letter-spacing="-0.5">Ideas</text>
      <text x="0" y="46" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#EAEAE2" letter-spacing="-0.5">Strategy</text>
      <text x="0" y="92" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#EAEAE2" letter-spacing="-0.5">Execution</text>
      <!-- Subtly lit lime indicator dot -->
      <circle cx="200" cy="82" r="4" fill="#D4FF00"/>
    </g>

    <!-- Subtle Screen Header Bar / Code IDE Vibe -->
    <circle cx="160" cy="76" r="4" fill="#FF5F56"/>
    <circle cx="174" cy="76" r="4" fill="#FFBD2E"/>
    <circle cx="188" cy="76" r="4" fill="#27C93F"/>
  </g>

  <!-- Potted Plant (Right of Desk) -->
  <g transform="translate(515, 260)" filter="url(#subtleShadow)">
    <path d="M15 80 L45 80 L52 140 L8 140 Z" fill="#1A1C1E"/>
    <!-- Foliage -->
    <path d="M30 80 C10 60 5 30 30 10 C35 35 30 65 30 80 Z" fill="#2C322B"/>
    <path d="M30 80 C50 55 55 25 35 5 C25 30 28 60 30 80 Z" fill="#3D453C"/>
    <path d="M30 80 C-5 70 -10 40 15 30 C20 50 25 70 30 80 Z" fill="#222722"/>
    <path d="M30 80 C65 75 70 45 45 35 C40 55 35 72 30 80 Z" fill="#485247"/>
  </g>

  <!-- Coffee Mug (Left of Desk) -->
  <g transform="translate(430, 370)" filter="url(#subtleShadow)">
    <rect x="10" y="10" width="40" height="50" rx="6" fill="#1C1E21"/>
    <path d="M50 20 C62 20 62 45 50 45" fill="none" stroke="#1C1E21" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="30" cy="12" rx="18" ry="5" fill="#3A281C"/>
  </g>

  <!-- Keyboard (Foreground Center) -->
  <g transform="translate(180, 400)" filter="url(#subtleShadow)">
    <rect x="0" y="0" width="210" height="40" rx="6" fill="#D2D2C6" stroke="#B0B0A2" stroke-width="1"/>
    <!-- Key Grid Lines -->
    <rect x="10" y="6" width="190" height="28" rx="3" fill="#1A1C1E"/>
    <!-- Keys simulation -->
    <line x1="20" y1="13" x2="190" y2="13" stroke="#3A3D44" stroke-width="3" stroke-dasharray="8 3"/>
    <line x1="20" y1="20" x2="190" y2="20" stroke="#3A3D44" stroke-width="3" stroke-dasharray="10 3"/>
    <line x1="20" y1="27" x2="190" y2="27" stroke="#3A3D44" stroke-width="3" stroke-dasharray="14 3"/>
  </g>

  <!-- Mouse (Foreground Right) -->
  <g transform="translate(415, 412)" filter="url(#subtleShadow)">
    <ellipse cx="20" cy="20" rx="15" ry="22" fill="#1A1C1E"/>
    <line x1="20" y1="4" x2="20" y2="18" stroke="#3A3D44" stroke-width="2"/>
  </g>
</svg>
