<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <linearGradient id="contactScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252A"/>
      <stop offset="100%" stop-color="#0E0F11"/>
    </linearGradient>
    <linearGradient id="contactDeskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E0"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
    <filter id="contactShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Desk Surface & Wall -->
  <rect width="600" height="500" fill="#EAEAE2"/>
  <!-- Dark Wall Partition in Background Right -->
  <path d="M320 0 L600 0 L600 500 L320 500 Z" fill="#999990" opacity="0.25"/>
  <path d="M0 370 L600 370 L600 500 L0 500 Z" fill="url(#contactDeskGrad)"/>
  <line x1="0" y1="370" x2="600" y2="370" stroke="#B8B8AB" stroke-width="2"/>

  <!-- Sleek Ergonomic Chair (Left Background) -->
  <g transform="translate(10, 80)" opacity="0.9">
    <path d="M80 60 C80 20 120 10 160 30 C180 40 185 100 180 180 C175 240 120 270 80 270 Z" fill="#141518" filter="url(#contactShadow)"/>
    <path d="M100 270 L95 380 M150 270 L155 380" stroke="#0E0E0E" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Open Laptop (Foreground Center-Left) -->
  <g transform="translate(110, 210)" filter="url(#contactShadow)">
    <!-- Base -->
    <path d="M10 140 L250 140 C260 140 265 145 260 150 L240 160 C235 162 25 162 20 160 L0 150 C-5 145 0 140 10 140 Z" fill="#2B2D32"/>
    <!-- Screen Lid -->
    <path d="M25 10 L235 10 L250 140 L10 140 Z" fill="#121315" stroke="#3A3D44" stroke-width="2"/>
    <!-- Display Area -->
    <path d="M33 18 L227 18 L240 132 L20 132 Z" fill="url(#contactScreenGrad)"/>
    <!-- Glowing Apple / Logo Sim -->
    <ellipse cx="130" cy="75" rx="8" ry="10" fill="#FFFFFF" opacity="0.15"/>
    <!-- Screen Code Lines Sim -->
    <line x1="45" y1="45" x2="110" y2="45" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="45" y1="60" x2="160" y2="60" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="75" x2="130" y2="75" stroke="#888880" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Black Coffee Mug with Typography "Good Ideas Better Results." -->
  <g transform="translate(420, 240)" filter="url(#contactShadow)">
    <rect x="0" y="20" width="75" height="95" rx="10" fill="#141517"/>
    <!-- Handle -->
    <path d="M75 35 C98 35 98 80 75 80" fill="none" stroke="#141517" stroke-width="11" stroke-linecap="round"/>
    <!-- Mug Typography -->
    <text x="37" y="48" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="0.5">Good</text>
    <text x="37" y="62" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="0.5">Ideas</text>
    <text x="37" y="76" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#D4FF00" letter-spacing="0.5">Better</text>
    <text x="37" y="90" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="0.5">Results.</text>
  </g>

  <!-- Minimal Notebook & Pen (Foreground Right) -->
  <g transform="translate(380, 375)" filter="url(#contactShadow)">
    <rect x="0" y="0" width="130" height="90" rx="4" fill="#1C1E22" stroke="#33363D" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="20" y2="90" stroke="#33363D" stroke-width="2"/>
    <!-- Pen -->
    <line x1="140" y1="10" x2="140" y2="80" stroke="#D2D2C8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Small Minimal Potted Plant (Right Wall) -->
  <g transform="translate(500, 160)" filter="url(#contactShadow)">
    <path d="M15 60 L45 60 L50 110 L10 110 Z" fill="#1C1E22"/>
    <!-- Plant Leaves -->
    <path d="M30 60 C15 40 10 20 30 5 C35 25 32 48 30 60 Z" fill="#282C27"/>
    <path d="M30 60 C45 42 50 20 35 2 C28 22 30 48 30 60 Z" fill="#3D453C"/>
  </g>
</svg>
